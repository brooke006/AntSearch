# Local dev stack: Redis, the coordinator and two workers.
#   docker compose up --build

x-worker: &worker
  build: .
  command: ["python", "-m", "antsearch.worker"]
  stop_grace_period: 3m  # let a running transit search finish and report before the worker exits; a first download can take over a minute
  depends_on:
    coordinator:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 1s

  coordinator:
    build: .
    command: ["python", "-m", "antsearch.coordinator"]
    environment:
      REDIS_URL: redis://redis:6379/0
      COORDINATOR_HOST: 0.0.0.0
      COORDINATOR_PORT: "8000"
      HEARTBEAT_TIMEOUT: ${HEARTBEAT_TIMEOUT:-30}
    ports:
      - "${ANTSEARCH_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 1s

  worker-1:
    <<: *worker
    environment:
      COORDINATOR_URL: http://coordinator:8000
      WORKER_ID: worker-1
      WORKER_TASK: ${WORKER_TASK:-transit}
      SIMULATED_TASK_SECONDS: ${SIMULATED_TASK_SECONDS:-1}
      POLL_INTERVAL: ${POLL_INTERVAL:-2}

  worker-2:
    <<: *worker
    environment:
      COORDINATOR_URL: http://coordinator:8000
      WORKER_ID: worker-2
      WORKER_TASK: ${WORKER_TASK:-transit}
      SIMULATED_TASK_SECONDS: ${SIMULATED_TASK_SECONDS:-1}
      POLL_INTERVAL: ${POLL_INTERVAL:-2}
