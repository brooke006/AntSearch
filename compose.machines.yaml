# Worker containers simulating different machine sizes for multi-machine testing.
# Start with `make machines` (or COPIES=N) against `make coordinator`.
# `make machines PREFETCH=1` gives each machine a random number of cached stars (DESKTOP_PREFETCH
# and so on), shown in its name, e.g. daniel-desktop-cached12.

x-machine: &machine
  build: .
  image: ${IMAGE:-antsearch:dev}
  command: ["python", "-m", "antsearch.worker"]
  stop_grace_period: 3m

x-env: &env
  COORDINATOR_URL: ${COORDINATOR_URL:-http://host.docker.internal:8000}
  WORKER_TASK: ${WORKER_TASK:-transit}
  POLL_INTERVAL: ${POLL_INTERVAL:-2}
  PREFETCH_FROM: ${PREFETCH_FROM:-20}

services:
  desktop:
    <<: *machine
    hostname: ${MACHINE_PREFIX:-${USER:-local}}-desktop
    cpus: 4
    mem_limit: 4g
    environment:
      <<: *env
      WORKER_ID: ${MACHINE_PREFIX:-${USER:-local}}-desktop${DESKTOP_PREFETCH:+-cached${DESKTOP_PREFETCH}}
      PREFETCH: ${DESKTOP_PREFETCH:-0}
      SIMULATED_TASK_SECONDS: 0.5

  laptop:
    <<: *machine
    hostname: ${MACHINE_PREFIX:-${USER:-local}}-laptop
    cpus: 2
    mem_limit: 2g
    environment:
      <<: *env
      WORKER_ID: ${MACHINE_PREFIX:-${USER:-local}}-laptop${LAPTOP_PREFETCH:+-cached${LAPTOP_PREFETCH}}
      PREFETCH: ${LAPTOP_PREFETCH:-0}
      SIMULATED_TASK_SECONDS: 1

  old-laptop:
    <<: *machine
    hostname: ${MACHINE_PREFIX:-${USER:-local}}-old-laptop
    cpus: 1
    mem_limit: 1.5g
    environment:
      <<: *env
      WORKER_ID: ${MACHINE_PREFIX:-${USER:-local}}-old-laptop${OLD_LAPTOP_PREFETCH:+-cached${OLD_LAPTOP_PREFETCH}}
      PREFETCH: ${OLD_LAPTOP_PREFETCH:-0}
      SIMULATED_TASK_SECONDS: 2

  netbook:
    <<: *machine
    hostname: ${MACHINE_PREFIX:-${USER:-local}}-netbook
    cpus: 0.5
    mem_limit: 1g
    environment:
      <<: *env
      WORKER_ID: ${MACHINE_PREFIX:-${USER:-local}}-netbook${NETBOOK_PREFETCH:+-cached${NETBOOK_PREFETCH}}
      PREFETCH: ${NETBOOK_PREFETCH:-0}
      SIMULATED_TASK_SECONDS: 4

  potato:
    <<: *machine
    hostname: ${MACHINE_PREFIX:-${USER:-local}}-potato
    cpus: 0.25
    mem_limit: 1g
    environment:
      <<: *env
      WORKER_ID: ${MACHINE_PREFIX:-${USER:-local}}-potato${POTATO_PREFETCH:+-cached${POTATO_PREFETCH}}
      PREFETCH: ${POTATO_PREFETCH:-0}
      SIMULATED_TASK_SECONDS: 2
      SLOWDOWN: 4
