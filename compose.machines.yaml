# Worker containers simulating different machine sizes for multi-machine testing.
# Start with `make machines` (or COPIES=N) against `make coordinator`.

x-machine: &machine
  build: .
  image: ${IMAGE:-antsearch:dev}
  command: ["python", "-m", "antsearch.worker"]
  stop_grace_period: 3m

x-env: &env
  COORDINATOR_URL: ${COORDINATOR_URL:-http://host.docker.internal:8000}
  WORKER_TASK: ${WORKER_TASK:-transit}
  POLL_INTERVAL: ${POLL_INTERVAL:-2}

services:
  desktop:
    <<: *machine
    hostname: ${MACHINE_PREFIX:-${USER:-local}}-desktop
    cpus: 4
    mem_limit: 4g
    environment:
      <<: *env
      WORKER_ID: ${MACHINE_PREFIX:-${USER:-local}}-desktop
      SIMULATED_TASK_SECONDS: 0.5

  laptop:
    <<: *machine
    hostname: ${MACHINE_PREFIX:-${USER:-local}}-laptop
    cpus: 2
    mem_limit: 2g
    environment:
      <<: *env
      WORKER_ID: ${MACHINE_PREFIX:-${USER:-local}}-laptop
      SIMULATED_TASK_SECONDS: 1

  old-laptop:
    <<: *machine
    hostname: ${MACHINE_PREFIX:-${USER:-local}}-old-laptop
    cpus: 1
    mem_limit: 1.5g
    environment:
      <<: *env
      WORKER_ID: ${MACHINE_PREFIX:-${USER:-local}}-old-laptop
      SIMULATED_TASK_SECONDS: 2

  netbook:
    <<: *machine
    hostname: ${MACHINE_PREFIX:-${USER:-local}}-netbook
    cpus: 0.5
    mem_limit: 1g
    environment:
      <<: *env
      WORKER_ID: ${MACHINE_PREFIX:-${USER:-local}}-netbook
      SIMULATED_TASK_SECONDS: 4

  potato:
    <<: *machine
    hostname: ${MACHINE_PREFIX:-${USER:-local}}-potato
    cpus: 0.25
    mem_limit: 1g
    environment:
      <<: *env
      WORKER_ID: ${MACHINE_PREFIX:-${USER:-local}}-potato
      SIMULATED_TASK_SECONDS: 2
      SLOWDOWN: 4
