[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antsearch"
version = "0.1.0"
description = "A Python volunteer-computing system for exoplanet searches using ant-inspired task scheduling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "redis>=5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["fakeredis>=2.20", "httpx2>=2.16; python_version >= '3.11'", "pytest>=8", "pytest-cov>=5"]
science = ["astropy>=6", "lightkurve>=2.4", "matplotlib>=3.8", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "science: light-curve pipeline tests (synthetic data, no network; slower)",
    "integration: tests against a running compose stack (set ANTSEARCH_URL; see make test-integration)",
]
