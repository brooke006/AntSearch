[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antsearch"
version = "0.1.0"
description = "A Python volunteer-computing system for exoplanet searches using ant-inspired task scheduling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "redis>=5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["fakeredis>=2.20", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
